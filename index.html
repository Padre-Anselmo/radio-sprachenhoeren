    :root {
        --bg: #f4f4f4;
        --panel: #ffffff;
        --text: #222;
        --muted: #666;
        --border: #d0d0d0;
        --accent: #2f5d8a;
        --accent-light: #e8f0f8;
        --disabled: #eeeeee;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    .page {
        max-width: 1050px;
        margin: 24px auto;
        padding: 0 18px 30px;
    }

    h1 {
        font-size: 20px;
        font-weight: normal;
        color: var(--muted);
        margin: 0 0 18px;
    }

    .countries {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 18px;
    }

    .country {
        border: 1px solid var(--border);
        background: white;
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 15px;
        cursor: pointer;
    }

    .country-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
    }

    ```
    .language-group {
        margin-bottom: 22px;
        clear: both;
    }

    .group-title {
        font-size: 14px;
        font-weight: bold;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        padding-bottom: 6px;
        margin-bottom: 10px;
    }

    .country:hover {
        background: var(--accent-light);
    }

    .country.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }

    .stations {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 18px 20px 20px;
    }

    .stations h2 {
        font-size: 21px;
        font-weight: normal;
        margin: 0 0 14px;
    }

    .station-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .station {
        min-width: 210px;
        padding: 11px 15px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--disabled);
        color: #777;
        font-size: 16px;
        text-align: left;
        cursor: not-allowed;
    }

    .station.ready {
        background: var(--accent-light);
        color: var(--text);
        cursor: pointer;
    }

    .station.ready:hover {
        border-color: var(--accent);
    }

    .player {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        display: none;
    }

    .player.visible {
        display: block;
    }

    .now-playing {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 14px;
    }

    audio {
        width: 100%;
        max-width: 650px;
    }

    .note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
    }

    @media (max-width: 650px) {
        .country {
            flex: 1 0 auto;
        }
        .station {
            width: 100%;
        }
    }
</style>

        const countries = [];
        const countriesEl = document.getElementById("countries");
        const titleEl = document.getElementById("country-title");
        const stationListEl = document.getElementById("station-list");
        const playerEl = document.getElementById("player");
        const audioEl = document.getElementById("audio");
        const nowPlayingEl = document.getElementById("now-playing");

        let hls = null;

        groups.forEach(group => {
            const section = document.createElement("div");
            section.className = "language-group";

            const heading = document.createElement("div");
            heading.className = "group-title";
            heading.textContent = group.name;
            section.appendChild(heading);

            const row = document.createElement("div");
            row.className = "country-row";

            group.countries.forEach(country => {
                const index = countries.length;
                countries.push(country);

                const button = document.createElement("button");
                button.className = "country";
                button.textContent = `${country.flag} ${country.name}`;
                button.addEventListener("click", () => showCountry(index));
                row.appendChild(button);
            });

            section.appendChild(row);
            countriesEl.appendChild(section);
        });

        function stationObject(station) {
            return typeof station === "string"
                ? { name: station, url: "" }
                : station;
        }

        function stopCurrentStream() {
            if (hls) {
                hls.destroy();
                hls = null;
            }

            audioEl.pause();
            audioEl.removeAttribute("src");
            audioEl.load();
        }

        function playStation(url, name) {
            stopCurrentStream();

            nowPlayingEl.textContent = name;
            playerEl.classList.add("visible");

            if (url.includes(".m3u8") && typeof Hls !== "undefined" && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(audioEl);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    audioEl.play().catch(() => { });
                });
            } else if (
                url.includes(".m3u8") &&
                audioEl.canPlayType("application/vnd.apple.mpegurl")
            ) {
                audioEl.src = url;
                audioEl.play().catch(() => { });
            } else {
                audioEl.src = url;
                audioEl.play().catch(() => { });
            }
        }

        function showCountry(index) {
            const country = countries[index];

            document.querySelectorAll(".country").forEach((button, i) => {
                button.classList.toggle("active", i === index);
            });

            titleEl.textContent = `${country.flag}  ${country.name}`;
            stationListEl.innerHTML = "";

            playerEl.classList.remove("visible");
            stopCurrentStream();
            nowPlayingEl.textContent = "";

            country.stations.forEach(station => {
                const s = stationObject(station);
                const button = document.createElement("button");
                button.className = "station" + (s.url ? " ready" : "");
                button.textContent = `▶  ${s.name}`;

                if (s.url) {
                    button.addEventListener("click", () => {
                        playStation(s.url, s.name);
                    });
                }

                stationListEl.appendChild(button);
            });
        }

        showCountry(0);
